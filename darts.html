<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="main-container">
    <!-- Ez a konténer fogja össze a játékteret a pozicionáláshoz -->
    <div id="game-container">
        <canvas id="dartboard" width="600" height="600"></canvas>

        <!-- A progress bar-ok mostantól a vászonnal egy szinten vannak -->
        <div id="horizontal-progress-bar">
            <div id="horizontal-progress-value"></div>
        </div>
        <div id="vertical-progress-bar">
            <div id="vertical-progress-value"></div>
        </div>
    </div>
    <div id="ui-container">
        <div id="player-setup">
            <h2>Játékosok beállítása</h2>
            <div id="player-inputs">
                <input type="text" placeholder="1. Játékos neve" value="Player 1">
            </div>
            <div class="setup-controls">
                <button id="add-player">Játékos hozzáadása</button>
                <div class="setup-option">
                    <label for="game-mode-select">Játékmód:</label>
                    <select id="game-mode-select">
                        <option value="301">301</option>
                        <option value="501" selected>501</option>
                    </select>
                </div>
            </div>
            <button id="start-game">Játék indítása</button>
        </div>
        <div id="scoreboard" style="display: none;">
            <h2>Ponttábla</h2>
            <div id="player-scores"></div>
            <div class="scoreboard-footer">
                <p>Hátralévő dobások: <span id="remaining-throws"></span></p>
                <button id="mute-button">Némítás</button>
            </div>
        </div>
    </div>

    <!-- Játék vége képernyő -->
    <div id="end-game-screen" style="display: none;">
        <div id="end-game-box">
            <h2 id="winner-message"></h2>
            <button id="new-game-button">Új játék</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
